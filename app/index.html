<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d6e66">
  <title>Groupset Compatibility Toolbox</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Pièce cassée ou projet de montage : toutes les pièces compatibles, hors ligne.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <g class="gear">
            <circle cx="16" cy="16" r="6.5"/>
            <circle cx="16" cy="16" r="2.2"/>
            <path d="M16 4.5v3M16 24.5v3M4.5 16h3M24.5 16h3M7.9 7.9l2.1 2.1M22 22l2.1 2.1M7.9 24.1 10 22M22 10l2.1-2.1"/>
          </g>
        </svg>
      </span>
      <h1 class="title"><span>Groupset Compatibility Toolbox</span>
        <small data-t="Dépannage vélo hors ligne">Dépannage vélo hors ligne</small></h1>
    </div>
    <div class="top-actions">
      <div class="lang">
        <button id="lang" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Langue">🇫🇷</button>
        <ul id="lang-menu" class="lang-menu" role="menu" hidden></ul>
      </div>
      <button id="theme" class="icon-btn" type="button" aria-label="Changer de thème" data-t-label="Changer de thème">◐</button>
    </div>
  </header>
  <div class="tabs-wrap">
    <nav class="tabs" aria-label="Modes" data-t-label="Modes">
      <span class="tab-ink" aria-hidden="true"></span>
      <a class="tab" href="#/" data-tab="casse"><span class="ico" aria-hidden="true">🔧</span><span data-t="Pièce cassée">Pièce cassée</span></a>
      <a class="tab" href="#/dispo" data-tab="dispo"><span class="ico" aria-hidden="true">🧰</span><span data-t="Sous la main">Sous la main</span></a>
      <a class="tab" href="#/projet" data-tab="projet"><span class="ico" aria-hidden="true">🛠️</span><span data-t="Projet">Projet</span></a>
      <a class="tab" href="#/velo" data-tab="velo"><span class="ico" aria-hidden="true">🚲</span><span data-t="Mon vélo">Mon vélo</span><span id="bike-count" class="count"></span></a>
    </nav>
  </div>
  <main id="view" tabindex="-1">
    <div class="loading">
      <svg class="spinner" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="16" cy="16" r="6.5"/><path d="M16 4.5v3M16 24.5v3M4.5 16h3M24.5 16h3M7.9 7.9l2.1 2.1M22 22l2.1 2.1M7.9 24.1 10 22M22 10l2.1-2.1"/>
      </svg>
      <span>Chargement de la base…</span>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
