# Compile l'appli Android à chaque envoi :
#  - toujours : APK de test (debug), installable directement sur un téléphone ;
#  - si la clé de signature est configurée (secrets) : APK + AAB signés pour le Play Store.
name: Android

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Appli web → Android (base chiffrée)
        run: npm run build:mobile

      - name: Version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: groupset-toolbox-test-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Clé de signature
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK + AAB signés (Play Store)
        if: steps.keystore.outcome == 'success'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outcome == 'success'
        with:
          name: groupset-toolbox-release-${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
